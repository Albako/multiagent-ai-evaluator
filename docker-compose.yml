x-gpu-defaults: &gpu-defaults
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

x-jeston-gpu-defaults: &jetson-gpu-defaults
  runtime: nvidia
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: multiagent_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    profiles: ["pc0"]

  manager_worker1:
    build:
      context: ./backend
      dockerfile: Dockerfile.amd
    container_name: model_manager_pc1
    <<: *gpu-defaults
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models:z
    env_file:
      - .env
    environment:
      - MANAGER_PORT=8001
      - NODE_ROLE=worker1
      - LLAMA_THREADS=16
      - LLAMA_THREADS_BATCH=16
    restart: unless-stopped
    profiles: ["pc1"]

  manager_worker2:
    build:
      context: ./backend
      dockerfile: Dockerfile.jetson
    container_name: model_manager_pc2
    <<: *jetson-gpu-defaults
    ports:
      - "8002:8002"
    volumes:
      - ./models:/models:z
    env_file:
      - .env
    environment:
      - MANAGER_PORT=8002
      - NODE_ROLE=worker2
      - OVERRIDE_GPU_LAYERS=24
      - OVERRIDE_N_CTX=4096
      - N_BATCH=256
      - USE_MMAP=false
      - FLASH_ATTN=false
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    restart: unless-stopped
    profiles: ["pc2"]

  manager_judge:
    build:
      context: ./backend
      dockerfile: Dockerfile.intel
    container_name: model_manager_pc3
    <<: *gpu-defaults
    ports:
      - "8003:8003"
    volumes:
      - ./models:/models:z
    cpuset: "0,2,4,6,8,10,12,14"
    env_file:
      - .env
    environment:
      - MANAGER_PORT=8003
      - NODE_ROLE=judge
      - LLAMA_THREADS=8
      - LLAMA_THREADS_BATCH=8
    restart: unless-stopped
    profiles: ["pc3"]
